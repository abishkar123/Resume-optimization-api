name: Deploy Resume App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: resume-op-rg
  AZURE_WEBAPP_NAME: resume-op-app
  PACKAGE_PATH: ./publish
  NODE_VERSION: "22"

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          rm -rf "${{ env.PACKAGE_PATH }}"
          mkdir -p "${{ env.PACKAGE_PATH }}"
          cp -R dist "${{ env.PACKAGE_PATH }}/"
          cp package.json package-lock.json "${{ env.PACKAGE_PATH }}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-app
          path: ${{ env.PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-app
          path: ${{ env.PACKAGE_PATH }}

      - name: Validate Azure configuration
        run: |
          : "${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID as a repository variable or secret}"
          : "${AZURE_TENANT_ID:?Set AZURE_TENANT_ID as a repository variable or secret}"
          : "${AZURE_SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID as a repository variable or secret}"

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
          environment: azurecloud

      - name: Ensure App Service uses Node runtime
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --linux-fx-version "NODE|22-lts"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PACKAGE_PATH }}
